{% extends "base.html" %}
{% block title %}Login - AutoSecOps{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <span class="eyebrow">Secure access</span>
  <h1>Sign in</h1>
  <p class="small">Use your assigned SOC account to continue.</p>
  {% if error %}<div class="notice">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input id="username" name="username" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" class="primary wide">Sign in</button>
  </form>
  <p class="small">Local demonstration accounts are seeded during setup.</p>
</div>
{% endblock %}
